# Isolated in-memory H2 database (PostgreSQL compatibility mode) for automated tests.
# Prevents tests from modifying data/dayforgedb.mv.db or connecting to live Supabase PostgreSQL.
spring.datasource.url=jdbc:h2:mem:keizoku_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false
