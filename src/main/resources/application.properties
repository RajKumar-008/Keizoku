spring.application.name=keizoku
server.address=0.0.0.0
server.port=${PORT:10000}

# Supabase PostgreSQL Database Configuration (via environment variables)
# Required environment variables for production / Supabase:
#   SUPABASE_DB_URL
#   SUPABASE_DB_USERNAME
#   SUPABASE_DB_PASSWORD
# For local H2 development without PostgreSQL, set SPRING_PROFILES_ACTIVE=dev
# For local Supabase testing, create a gitignored application-local.properties and set SPRING_PROFILES_ACTIVE=local
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# HikariCP Connection Pool Tuning for Supabase Session Pooler
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# Active Profile: Defaults to 'prod' for production deployment.
# For local dev with H2, set SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# H2 Web Console (disabled in production; enabled in 'dev' profile)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security & JWT Configuration
dayforge.jwt.secret=4c6e9a72b8d145f3e9a08123456789abcdef4c6e9a72b8d145f3e9a08123456789abcdef
dayforge.jwt.expiration-ms=86400000

# File Upload / Multipart limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration (Never exposes sensitive database credentials)
logging.level.com.dayforge=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.level.com.zaxxer.hikari=INFO
