services:
  - type: web
    name: keizoku
    env: docker
    rootDir: .
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/ping
    disk:
      name: keizoku-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JAVA_VERSION
        value: "17"
      - key: PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SUPABASE_DB_URL
        value: jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
